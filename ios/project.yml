name: CapturePrototype

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    # Set DEVELOPMENT_TEAM to your own Apple team ID (Xcode > Signing & Capabilities,
    # or `DEVELOPMENT_TEAM=XXXXXXXXXX` on the xcodebuild command line) to run on a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

# Two guidance setups share one codebase (see docs/guidance-setups.md):
#   CapturePrototype      core: text coaching on any ARKit iPhone
#   CapturePrototypeFull  core + FullGuidance/ (LiDAR coverage mesh, gap
#                         coaching, walkthrough, finish review)
targetTemplates:
  CaptureApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - sdk: ARKit.framework
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

targets:
  CapturePrototype:
    templates: [CaptureApp]
    sources:
      - path: App
      - path: Capture
      - path: Storage
      - path: Screens
      - path: Resources
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.captureprototype
        PRODUCT_NAME: CapturePrototype
        PRODUCT_MODULE_NAME: CapturePrototype
        CAPTURE_DISPLAY_NAME: Capture Prototype

  CapturePrototypeFull:
    templates: [CaptureApp]
    sources:
      - path: App
      - path: Capture
      - path: Storage
      - path: Screens
      - path: FullGuidance
      - path: Resources
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.captureprototype.full
        PRODUCT_NAME: CapturePrototypeFull
        PRODUCT_MODULE_NAME: CapturePrototype
        CAPTURE_DISPLAY_NAME: Capture Full
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FULL_GUIDANCE"

  CapturePrototypeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: CapturePrototype
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.captureprototype.tests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: CapturePrototypeTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CapturePrototype.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CapturePrototype"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CapturePrototypeFullTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
      - path: FullGuidanceTests
    dependencies:
      - target: CapturePrototypeFull
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.captureprototype.full.tests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: CapturePrototypeFullTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CapturePrototypeFull.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CapturePrototypeFull"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  CapturePrototype:
    build:
      targets:
        CapturePrototype: all
        CapturePrototypeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CapturePrototypeTests
    archive:
      config: Release

  CapturePrototypeFull:
    build:
      targets:
        CapturePrototypeFull: all
        CapturePrototypeFullTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CapturePrototypeFullTests
    archive:
      config: Release
